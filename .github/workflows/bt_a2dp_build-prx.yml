name: build-prx

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Real PRX Binary
        run: |
          make clean
          make
          ls -la ps4bt.prx

      - name: Upload Real PRX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4bt-real-prx
          path: ps4bt.prx

name: Build Universal Hook bt_a2dp.prx

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Compile Universal Hook PRX
        run: |
          gcc -O3 -Wall -fPIC -shared src/bt_a2dp_main.c -o bt_a2dp.prx
          ls -la bt_a2dp.prx

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bt_a2dp-universal-hook-plugin
          path: bt_a2dp.prx

name: Build bt_all_devices.prx

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Compile Universal BT PRX
        run: |
          make clean || true
          make
          ls -la bt_all_devices.prx

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bt-all-devices-plugin
          path: bt_all_devices.prx
